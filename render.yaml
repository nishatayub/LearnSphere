services:
  - type: web
    name: learnsphere
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: "Data Source=LearnSphere.db"
      # Set this in the Render dashboard (Environment tab) rather than here -
      # render.yaml is committed to the repo and this is a secret.
      - key: Email__ApiKey
        sync: false
